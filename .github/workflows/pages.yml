name: Deploy backoffice to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deploys race; keep the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung install should fail in minutes, not sit for six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --no-audit is not cosmetic: the audit call goes to a separate endpoint
      # and has hung this job twice, stalling the whole deploy.
      - run: npm ci --no-audit --no-fund
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
        env:
          # Set this under Settings > Secrets and variables > Actions > Variables.
          # It is baked into the bundle, so it must be a public URL — never a secret.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://dws-api.xronocore.qzz.io' }}
          # Organization site: served from the root, not a repo subpath.
          VITE_BASE: /

      # Pages serves static files, so a deep link like /events would 404 on
      # reload. Copying index.html to 404.html hands routing back to the SPA.
      - run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
