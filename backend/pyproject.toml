[project]
name = "dws-manager-bot"
version = "0.1.0"
description = "Discord alliance manager for Dark War Survival — bot + backoffice API"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "SQLAlchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "APScheduler>=3.10.4",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "PyJWT>=2.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "croniter>=3.0.0",
    # The roster import: reads the uploaded workbook, writes the template.
    "openpyxl>=3.1.0",
    # Draws the BGB briefing cards. The wheels carry Raqm, which is what shapes
    # and reorders the Arabic one.
    "Pillow>=10.4.0",
    # Required, not optional: the card picks a font per string by reading each
    # face's cmap, and without this it guesses, which draws names like
    # "ČĔNGİZ ĤÃŃ" as empty boxes.
    "fonttools>=4.50.0",
    # FastAPI needs this to accept an uploaded file at all.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "aiosqlite>=0.20.0", "ruff>=0.6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "TRY", "BLE"]
ignore = [
    # A scheduled send must never take the process down, so the send and the
    # health check deliberately catch anything Discord or the driver raises.
    "BLE001",
    # RuntimeError reads better than TypeError for a misconfigured channel.
    "TRY004",
    # The trigger chain in scheduler._register is clearer branch-by-branch.
    "SIM103",
    # FastAPI/Pydantic idiom is a descriptive message at the raise site.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C408"]   # dict(...) keeps the test fixtures readable
# Vendored, near-verbatim, from pou-management/bgb/bgb_lineup.py. Reformatting
# it here would make the two copies diff against each other for no gain, and
# the point of keeping it recognisable is that a change upstream can be carried
# across by eye. Style is the upstream file's business.
"src/dwsbot/bgb/lineup.py" = ["E501", "C408", "B905", "TRY300", "SIM210", "I001", "F811"]
